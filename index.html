<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>What is cool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141311;
    --ink: #efe9df;
    --muted: #8a8378;
    --faint: #3b3833;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1280px;
    margin: 0 auto;
    padding: clamp(56px, 10vw, 160px) clamp(16px, 5vw, 72px) 96px;
  }

  h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(76px, 22vw, 300px);
    line-height: .86;
    letter-spacing: -.055em;
    max-width: 6.2em;
    will-change: transform, opacity;
  }
  h1 .word {
    display: inline-block;
    overflow: hidden;
    vertical-align: top;
    padding-bottom: .08em;
    margin-bottom: -.08em;
  }
  h1 .word > span {
    display: inline-block;
    transform: translateY(110%);
    animation: rise 1.1s cubic-bezier(.2, .75, 0, 1) forwards;
    animation-delay: calc(var(--i) * 110ms + 150ms);
  }
  @keyframes rise { to { transform: none; } }

  .entries {
    list-style: none;
    margin: clamp(48px, 7vw, 96px) 0 0 auto;
    padding: 0;
    width: min(100%, 520px);
    text-align: right;
    text-transform: uppercase;
    font-size: clamp(15px, 1.6vw, 20px);
    line-height: 1.3;
    letter-spacing: -.005em;
    position: relative;
  }
  .entries li { margin: 0; }
  .entries li.reveal {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .8s ease, transform .9s cubic-bezier(.2, .75, 0, 1);
    transition-delay: var(--d, 0ms);
  }
  .entries li.reveal.in { opacity: 1; transform: none; }
  .entries .name { color: var(--muted); font-size: .72em; letter-spacing: .06em; margin-left: .6em; white-space: nowrap; }
  .entries li.waiting { color: var(--faint); }
  .entries li.waiting .name { color: var(--faint); }
  .entries li.new { animation: arrive 1.6s ease both; }
  @keyframes arrive {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 .word > span { animation: none; transform: none; }
    .entries li.reveal { opacity: 1; transform: none; transition: none; }
    .entries li.new { animation: none; }
  }

  .error { color: var(--muted); text-transform: uppercase; font-size: 14px; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="page">
  <h1 id="title"><span class="word" style="--i:0"><span>What</span></span> <span class="word" style="--i:1"><span>is</span></span> <span class="word" style="--i:2"><span>cool</span></span></h1>
  <ul class="entries" id="entries"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  const PLACEHOLDER = "(write your line here)";
  const REFRESH_SECONDS = 30;
  let lastSource = null;
  let writtenBefore = new Set();
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const revealed = new Set();
  let firstBatchDelay = 650;

  // Fade lines up as they scroll into view, staggered within each batch.
  const observer = new IntersectionObserver((items) => {
    items.filter((item) => item.isIntersecting).forEach((item, i) => {
      const li = item.target;
      li.style.setProperty("--d", (firstBatchDelay + i * 45) + "ms");
      li.classList.add("in");
      revealed.add(li.dataset.name);
      observer.unobserve(li);
    });
    firstBatchDelay = 0;
  }, { rootMargin: "0px 0px -8% 0px" });

  function setTitle(text) {
    const h1 = document.getElementById("title");
    if (h1.textContent.replace(/\s+/g, " ").trim() === text) return;
    h1.innerHTML = "";
    text.split(/\s+/).forEach((word, i) => {
      if (i) h1.append(" ");
      const outer = document.createElement("span");
      outer.className = "word";
      outer.style.setProperty("--i", i);
      const inner = document.createElement("span");
      inner.textContent = word;
      outer.append(inner);
      h1.append(outer);
    });
  }

  // Headline drifts up slower than the page and fades as you scroll.
  if (!reduceMotion) {
    const h1 = document.getElementById("title");
    let ticking = false;
    addEventListener("scroll", () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y = scrollY;
        h1.style.transform = "translateY(" + (y * 0.35) + "px)";
        h1.style.opacity = Math.max(0.15, 1 - y / 700);
        ticking = false;
      });
    }, { passive: true });
  }

  function render(source) {
    const title = source.match(/^# (.+)$/m);
    if (title) setTitle(title[1].trim());

    const list = document.getElementById("entries");
    observer.disconnect();
    list.innerHTML = "";
    const writtenNow = new Set();

    for (const [, name, text] of source.matchAll(/^\*\*(.+?):\*\*\s*(.*)$/gm)) {
      const li = document.createElement("li");
      li.dataset.name = name;
      const label = document.createElement("span");
      label.className = "name";
      label.textContent = "— " + name;

      if (text.includes(PLACEHOLDER) || !text.trim()) {
        li.classList.add("waiting");
      } else {
        writtenNow.add(name);
        const line = document.createElement("span");
        line.innerHTML = DOMPurify.sanitize(marked.parseInline(text));
        li.append(line);
        if (lastSource !== null && !writtenBefore.has(name)) li.classList.add("new");
      }
      li.append(label);
      list.append(li);
      if (!reduceMotion && !revealed.has(name)) {
        li.classList.add("reveal");
        observer.observe(li);
      }
    }

    writtenBefore = writtenNow;
  }

  async function load() {
    try {
      const res = await fetch("PLAY.md?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const source = await res.text();
      if (source !== lastSource) {
        render(source);
        lastSource = source;
      }
    } catch (e) {
      if (lastSource === null) {
        document.getElementById("entries").innerHTML =
          '<li class="error">Couldn’t load the list. Try refreshing.</li>';
      }
    }
  }

  load();
  setInterval(load, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
