<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>What is cool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141311;
    --ink: #efe9df;
    --muted: #8a8378;
    --faint: #3b3833;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1280px;
    margin: 0 auto;
    padding: clamp(56px, 10vw, 160px) clamp(16px, 5vw, 72px) 96px;
  }

  h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(76px, 22vw, 300px);
    line-height: .86;
    letter-spacing: -.055em;
    max-width: 6.2em;
    will-change: transform, opacity;
  }
  h1 .word {
    display: inline-block;
    overflow: hidden;
    vertical-align: top;
    /* Room around each word so the mask doesn't clip letters that reach past it */
    padding: .04em .12em .08em;
    margin: -.04em -.12em -.08em;
  }
  h1 .word > span {
    display: inline-block;
    transform: translateY(110%);
    animation: rise 1.1s cubic-bezier(.2, .75, 0, 1) forwards;
    animation-delay: calc(var(--i) * 110ms + 150ms);
  }
  @keyframes rise { to { transform: none; } }

  /* WebGL copy of the headline that ripples under the cursor */
  h1 { position: relative; }
  h1 canvas.gl { position: absolute; pointer-events: none; opacity: 0; }
  h1.gl-on canvas.gl { opacity: 1; }
  h1.gl-on .word > span { color: transparent; }

  .entries {
    list-style: none;
    margin: clamp(48px, 7vw, 96px) 0 0 auto;
    padding: 0;
    width: min(100%, 520px);
    text-align: right;
    text-transform: uppercase;
    font-size: clamp(15px, 1.6vw, 20px);
    line-height: 1.3;
    letter-spacing: -.005em;
    position: relative;
  }
  .entries li { margin: 0; }
  .entries li.reveal {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .8s ease, transform .9s cubic-bezier(.2, .75, 0, 1);
    transition-delay: var(--d, 0ms);
  }
  .entries li.reveal.in { opacity: 1; transform: none; }
  .entries .name { color: var(--muted); font-size: .72em; letter-spacing: .06em; margin-left: .6em; white-space: nowrap; }
  .entries li.waiting { color: var(--faint); }
  .entries li.waiting .name { color: var(--faint); }
  .entries li.new { animation: arrive 1.6s ease both; }
  @keyframes arrive {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 .word > span { animation: none; transform: none; }
    .entries li.reveal { opacity: 1; transform: none; transition: none; }
    .entries li.new { animation: none; }
  }

  .error { color: var(--muted); text-transform: uppercase; font-size: 14px; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="page">
  <h1 id="title"><span class="word" style="--i:0"><span>What</span></span> <span class="word" style="--i:1"><span>is</span></span> <span class="word" style="--i:2"><span>cool</span></span></h1>
  <ul class="entries" id="entries"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  const PLACEHOLDER = "(write your line here)";
  const REFRESH_SECONDS = 30;
  let lastSource = null;
  let writtenBefore = new Set();
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const revealed = new Set();
  let firstBatchDelay = 650;

  // Fade lines up as they scroll into view, staggered within each batch.
  const observer = new IntersectionObserver((items) => {
    items.filter((item) => item.isIntersecting).forEach((item, i) => {
      const li = item.target;
      li.style.setProperty("--d", (firstBatchDelay + i * 45) + "ms");
      li.classList.add("in");
      revealed.add(li.dataset.name);
      observer.unobserve(li);
    });
    firstBatchDelay = 0;
  }, { rootMargin: "0px 0px -8% 0px" });

  function setTitle(text) {
    const h1 = document.getElementById("title");
    if (h1.textContent.replace(/\s+/g, " ").trim() === text) return;
    h1.innerHTML = "";
    text.split(/\s+/).forEach((word, i) => {
      if (i) h1.append(" ");
      const outer = document.createElement("span");
      outer.className = "word";
      outer.style.setProperty("--i", i);
      const inner = document.createElement("span");
      inner.textContent = word;
      outer.append(inner);
      h1.append(outer);
    });
    if (ripple) ripple.refresh();
  }

  // Headline drifts up slower than the page and fades as you scroll.
  if (!reduceMotion) {
    const h1 = document.getElementById("title");
    let ticking = false;
    addEventListener("scroll", () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y = scrollY;
        h1.style.transform = "translateY(" + (y * 0.35) + "px)";
        h1.style.opacity = Math.max(0.15, 1 - y / 700);
        ticking = false;
      });
    }, { passive: true });
  }

  function render(source) {
    const title = source.match(/^# (.+)$/m);
    if (title) setTitle(title[1].trim());

    const list = document.getElementById("entries");
    observer.disconnect();
    list.innerHTML = "";
    const writtenNow = new Set();

    for (const [, name, text] of source.matchAll(/^\*\*(.+?):\*\*\s*(.*)$/gm)) {
      const li = document.createElement("li");
      li.dataset.name = name;
      const label = document.createElement("span");
      label.className = "name";
      label.textContent = "— " + name;

      if (text.includes(PLACEHOLDER) || !text.trim()) {
        li.classList.add("waiting");
      } else {
        writtenNow.add(name);
        const line = document.createElement("span");
        line.innerHTML = DOMPurify.sanitize(marked.parseInline(text));
        li.append(line);
        if (lastSource !== null && !writtenBefore.has(name)) li.classList.add("new");
      }
      li.append(label);
      list.append(li);
      if (!reduceMotion && !revealed.has(name)) {
        li.classList.add("reveal");
        observer.observe(li);
      }
    }

    writtenBefore = writtenNow;
  }

  async function load() {
    try {
      const res = await fetch("PLAY.md?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const source = await res.text();
      if (source !== lastSource) {
        render(source);
        lastSource = source;
      }
    } catch (e) {
      if (lastSource === null) {
        document.getElementById("entries").innerHTML =
          '<li class="error">Couldn’t load the list. Try refreshing.</li>';
      }
    }
  }

  // Liquid ripple: after the intro, the headline is redrawn on a WebGL canvas
  // in the same spot, and the canvas is warped around the cursor.
  const RIPPLE_POINTS = 24;
  const RIPPLE_LIFE = 1.6; // seconds a ripple lasts
  let ripple = null;

  function startRipple() {
    const h1 = document.getElementById("title");
    const canvas = document.createElement("canvas");
    canvas.className = "gl";
    canvas.setAttribute("aria-hidden", "true");
    const gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true });
    if (!gl) return null;

    const vertexSource = `
      attribute vec2 a;
      varying vec2 v;
      void main() {
        v = vec2(a.x * .5 + .5, .5 - a.y * .5);
        gl_Position = vec4(a, 0., 1.);
      }`;
    const fragmentSource = `
      precision highp float;
      uniform sampler2D tex;
      uniform vec2 res;
      uniform float k;
      uniform vec3 pts[${RIPPLE_POINTS}];
      uniform float str[${RIPPLE_POINTS}];
      varying vec2 v;
      void main() {
        vec2 px = v * res;
        vec2 off = vec2(0.);
        for (int i = 0; i < ${RIPPLE_POINTS}; i++) {
          float age = pts[i].z;
          if (age < 0. || age > ${RIPPLE_LIFE.toFixed(2)}) continue;
          vec2 d = px - pts[i].xy;
          float r = length(d) + .001;
          float fade = 1. - age / ${RIPPLE_LIFE.toFixed(2)};
          fade *= fade;
          float radius = (20. + age * 240.) * k;
          float ring = exp(-pow((r - radius) / (55. * k), 2.));
          float wave = sin((r - radius) * .06 / k);
          off += d / r * ring * wave * fade * str[i] * 8. * k;
        }
        // Cap the warp so letters bend without tearing apart.
        float len = length(off);
        float cap = 12. * k;
        if (len > cap) off *= cap / len;
        gl_FragColor = texture2D(tex, (px - off) / res);
      }`;

    function shader(type, source) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    gl.useProgram(program);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const aLoc = gl.getAttribLocation(program, "a");
    gl.enableVertexAttribArray(aLoc);
    gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);

    const u = (name) => gl.getUniformLocation(program, name);
    const uRes = u("res"), uK = u("k"), uPts = u("pts"), uStr = u("str");

    const born = new Float64Array(RIPPLE_POINTS).fill(-1);
    const px = new Float32Array(RIPPLE_POINTS);
    const py = new Float32Array(RIPPLE_POINTS);
    const strength = new Float32Array(RIPPLE_POINTS);
    const ptsData = new Float32Array(RIPPLE_POINTS * 3);
    let next = 0, last = null, raf = 0, scale = 1, cssW = 0, cssH = 0;

    // Draw the headline text into a texture, word by word, at the exact
    // positions the real text occupies on the page.
    function build() {
      const cs = getComputedStyle(h1);
      const fontSize = parseFloat(cs.fontSize);
      const pad = Math.round(fontSize * .2);
      const box = h1.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio || 1, 2);
      scale = fontSize / 200;
      cssW = box.width + pad * 2;
      cssH = box.height + pad * 2;

      Object.assign(canvas.style, {
        left: -pad + "px", top: -pad + "px", width: cssW + "px", height: cssH + "px",
      });
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);

      const art = document.createElement("canvas");
      art.width = canvas.width;
      art.height = canvas.height;
      const ctx = art.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.font = `${cs.fontWeight} ${fontSize}px ${cs.fontFamily}`;
      ctx.fillStyle = cs.color;
      ctx.textBaseline = "alphabetic";
      const spacing = parseFloat(cs.letterSpacing) || 0;
      const canSpace = "letterSpacing" in ctx;
      if (canSpace) ctx.letterSpacing = spacing + "px";
      const metrics = ctx.measureText("What is cool");
      const ascent = metrics.fontBoundingBoxAscent;
      const descent = metrics.fontBoundingBoxDescent;

      h1.querySelectorAll(".word > span").forEach((span) => {
        const r = span.getBoundingClientRect();
        let x = r.left - box.left + pad;
        const y = r.top - box.top + pad + (r.height - (ascent + descent)) / 2 + ascent;
        if (canSpace) {
          ctx.fillText(span.textContent, x, y);
        } else {
          for (const ch of span.textContent) {
            ctx.fillText(ch, x, y);
            x += ctx.measureText(ch).width + spacing;
          }
        }
      });

      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, art);
      gl.uniform2f(uRes, cssW, cssH);
      gl.uniform1f(uK, scale);
      draw(performance.now());
    }

    function draw(now) {
      let active = false;
      for (let i = 0; i < RIPPLE_POINTS; i++) {
        const age = born[i] < 0 ? -1 : (now - born[i]) / 1000;
        const alive = age >= 0 && age <= RIPPLE_LIFE;
        if (alive) active = true;
        ptsData[i * 3] = px[i];
        ptsData[i * 3 + 1] = py[i];
        ptsData[i * 3 + 2] = alive ? age : -1;
      }
      gl.uniform3fv(uPts, ptsData);
      gl.uniform1fv(uStr, strength);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      return active;
    }

    function frame(now) {
      raf = draw(now) ? requestAnimationFrame(frame) : 0;
    }

    addEventListener("pointermove", (e) => {
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const margin = 120 * scale;
      if (x < -margin || y < -margin || x > r.width + margin || y > r.height + margin) {
        last = null;
        return;
      }
      const now = performance.now();
      if (last) {
        const dist = Math.hypot(x - last.x, y - last.y);
        if (dist < 14 * scale) return;
        const speed = dist / Math.max(16, now - last.t);
        strength[next] = Math.min(1, Math.max(.3, speed / 1.2));
      } else {
        strength[next] = .5;
      }
      px[next] = x;
      py[next] = y;
      born[next] = now;
      next = (next + 1) % RIPPLE_POINTS;
      last = { x, y, t: now };
      if (!raf) raf = requestAnimationFrame(frame);
    }, { passive: true });

    let resizeTimer = 0;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(build, 150);
    });

    h1.append(canvas);
    build();
    h1.classList.add("gl-on");

    return {
      // Called when the headline text is rebuilt, which replays the intro.
      refresh() {
        h1.classList.remove("gl-on");
        h1.append(canvas);
        introFinished().then(() => { build(); h1.classList.add("gl-on"); });
      },
    };
  }

  // Resolves when the headline's rise-in animation has really finished.
  // Browsers pause animations in background tabs, so a fixed timer isn't enough.
  function introFinished() {
    const spans = [...document.querySelectorAll("#title .word > span")];
    const animations = spans.flatMap((s) => (s.getAnimations ? s.getAnimations() : []));
    return Promise.all(animations.map((a) => a.finished.catch(() => {})));
  }

  if (!reduceMotion) {
    const introDone = introFinished();
    const fontReady = document.fonts ? document.fonts.load('800 100px "Inter Tight"') : Promise.resolve();
    Promise.all([introDone, fontReady.catch(() => {})]).then(() => {
      try { ripple = startRipple(); } catch (e) { console.warn("Ripple off:", e); }
    });
  }

  load();
  setInterval(load, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
