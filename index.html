<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>What is cool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141311;
    --ink: #efe9df;
    --muted: #8a8378;
    --faint: #3b3833;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1280px;
    margin: 0 auto;
    padding: clamp(56px, 10vw, 160px) clamp(16px, 5vw, 72px) 96px;
  }

  h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(76px, 22vw, 300px);
    line-height: .86;
    letter-spacing: -.055em;
    max-width: 6.2em;
  }

  .entries {
    list-style: none;
    margin: clamp(48px, 7vw, 96px) 0 0 auto;
    padding: 0;
    width: min(100%, 520px);
    text-align: right;
    text-transform: uppercase;
    font-size: clamp(15px, 1.6vw, 20px);
    line-height: 1.3;
    letter-spacing: -.005em;
  }
  .entries li { margin: 0; }
  .entries .name { color: var(--muted); font-size: .72em; letter-spacing: .06em; margin-left: .6em; white-space: nowrap; }
  .entries li.waiting { color: var(--faint); }
  .entries li.waiting .name { color: var(--faint); }
  .entries li.new { animation: arrive 1.6s ease both; }
  @keyframes arrive {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .error { color: var(--muted); text-transform: uppercase; font-size: 14px; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="page">
  <h1 id="title">What is cool</h1>
  <ul class="entries" id="entries"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
  const PLACEHOLDER = "(write your line here)";
  const REFRESH_SECONDS = 30;
  let lastSource = null;
  let writtenBefore = new Set();

  function render(source) {
    const title = source.match(/^# (.+)$/m);
    if (title) document.getElementById("title").textContent = title[1].trim();

    const list = document.getElementById("entries");
    list.innerHTML = "";
    const writtenNow = new Set();

    for (const [, name, text] of source.matchAll(/^\*\*(.+?):\*\*\s*(.*)$/gm)) {
      const li = document.createElement("li");
      const label = document.createElement("span");
      label.className = "name";
      label.textContent = "— " + name;

      if (text.includes(PLACEHOLDER) || !text.trim()) {
        li.classList.add("waiting");
      } else {
        writtenNow.add(name);
        const line = document.createElement("span");
        line.innerHTML = DOMPurify.sanitize(marked.parseInline(text));
        li.append(line);
        if (lastSource !== null && !writtenBefore.has(name)) li.classList.add("new");
      }
      li.append(label);
      list.append(li);
    }

    writtenBefore = writtenNow;
  }

  async function load() {
    try {
      const res = await fetch("PLAY.md?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const source = await res.text();
      if (source !== lastSource) {
        render(source);
        lastSource = source;
      }
    } catch (e) {
      if (lastSource === null) {
        document.getElementById("entries").innerHTML =
          '<li class="error">Couldn’t load the list. Try refreshing.</li>';
      }
    }
  }

  load();
  setInterval(load, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
